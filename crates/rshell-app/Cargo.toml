[package]
name = "rshell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
rshell-core = { path = "../rshell-core" }
rshell-terminal = { path = "../rshell-terminal" }
anyhow.workspace = true
tokio.workspace = true
uuid.workspace = true
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "wgpu"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
directories = "6"
zeroize = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"

