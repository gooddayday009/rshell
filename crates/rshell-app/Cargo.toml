[package]
name = "rshell"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "rshell"

[[bin]]
name = "rshell-cli"
path = "src/cli/main.rs"

[dependencies]
serde_json.workspace = true
rshell-core = { path = "../rshell-core" }
rshell-terminal = { path = "../rshell-terminal" }
anyhow.workspace = true
tokio = { workspace = true, features = ["io-std", "signal"] }
uuid.workspace = true
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "links", "wgpu"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
directories = "6"
zeroize = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
rand = "0.10"

