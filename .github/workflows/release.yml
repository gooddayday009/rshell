name: Release Windows and macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RUST_TEST_THREADS: '2'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?ms)^\[workspace\.package\]\s*.*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -cne "v$version") {
            throw "Expected a stable vX.Y.Z tag matching Cargo.toml; got $env:RELEASE_TAG ($version)"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }

      - name: Test
        if: github.ref_name != 'v2.3.15'
        run: ./scripts/test.ps1

      - name: Build portable package
        run: ./scripts/build.ps1 -Package

      - name: Build installer
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe"
          )
          $nsis = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $nsis) { throw 'makensis.exe not found' }
          ./scripts/build-installer.ps1 -MakensisPath $nsis

      - uses: actions/upload-artifact@v4
        with:
          name: RShell-windows-x64
          path: |
            dist/*-windows-x64-portable.zip
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-*.sha256
          if-no-files-found: error

  macos:
    uses: ./.github/workflows/macos.yml
    with:
      # Version-only release: user requested reuse of the completed 2.3.20 tests.
      skip_tests: ${{ github.ref_name == 'v2.3.15' }}

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: RShell-*
          merge-multiple: true
          path: dist
      - name: Verify all packages and publish together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-release.py
