[workspace]
members = ["crates/rshell-core", "crates/rshell-terminal", "crates/rshell-app"]
resolver = "3"

[workspace.package]
version = "2.3.10"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

